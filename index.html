<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timeline Video Editor</title>
    <style>
        :root {
            --bg-dark: #0f1015;
            --panel-bg: #181922;
            --track-bg: #222431;
            --accent-purple: #6366f1;
            --accent-green: #10b981;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border: #2e303f;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Top Header Navbar */
        .navbar {
            height: 50px;
            background-color: var(--panel-bg);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
        }

        .project-title {
            font-weight: 600;
            font-size: 14px;
        }

        .export-btn {
            background-color: var(--accent-purple);
            color: #fff;
            border: none;
            padding: 6px 16px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 13px;
        }

        /* Main Studio Layout split into left controls and right preview */
        .workspace {
            display: flex;
            flex: 1;
            height: calc(100vh - 250px - 50px);
        }

        .sidebar-controls {
            width: 320px;
            background-color: var(--panel-bg);
            border-right: 1px solid var(--border);
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 16px;
            overflow-y: auto;
        }

        .control-block {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .control-block label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="text"], select, input[type="number"], input[type="file"] {
            background-color: #0c0d12;
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            outline: none;
        }

        .range-row {
            display: flex;
            gap: 10px;
        }

        .range-row > div {
            flex: 1;
        }

        .preview-area {
            flex: 1;
            background-color: #090a0f;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 20px;
        }

        .canvas-container {
            position: relative;
            box-shadow: 0 12px 24px rgba(0,0,0,0.6);
            border-radius: 4px;
            overflow: hidden;
            max-width: 100%;
            max-height: 85%;
        }

        canvas {
            display: block;
            background-color: #000;
            max-width: 100%;
            height: auto;
        }

        .player-bar {
            margin-top: 15px;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .play-pause-btn {
            background: none;
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 6px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
        }

        .play-pause-btn:hover {
            background-color: var(--track-bg);
        }

        .time-counter {
            font-family: monospace;
            font-size: 13px;
            color: var(--text-muted);
        }

        /* Bottom Multitrack Timeline Area */
        .timeline-container {
            height: 250px;
            background-color: var(--panel-bg);
            border-top: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .timeline-header-ruler {
            height: 30px;
            background-color: #13141c;
            border-bottom: 1px solid var(--border);
            position: relative;
        }

        .timeline-tracks {
            flex: 1;
            overflow-y: auto;
            position: relative;
            padding: 10px 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .track-row {
            height: 45px;
            background-color: var(--track-bg);
            margin: 0 20px;
            border-radius: 6px;
            position: relative;
            border: 1px dashed transparent;
        }

        .track-label {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 11px;
            font-weight: bold;
            color: var(--text-muted);
            z-index: 5;
            background-color: rgba(24,25,34,0.8);
            padding: 2px 6px;
            border-radius: 4px;
        }

        /* Video element track visualizer clip block style */
        .block-element {
            position: absolute;
            height: 80%;
            top: 10%;
            border-radius: 4px;
            display: flex;
            align-items: center;
            padding-left: 45px;
            font-size: 11px;
            font-weight: 600;
            box-sizing: border-box;
            overflow: hidden;
            white-space: nowrap;
        }

        .video-block {
            background: linear-gradient(90deg, #4f46e5, #3b82f6);
            border: 1px solid #6366f1;
            width: calc(100% - 20px);
        }

        .text-block {
            background: linear-gradient(90deg, #ec4899, #f43f5e);
            border: 1px solid #f472b6;
            width: calc(100% - 20px);
        }

        .audio-block {
            background: linear-gradient(90deg, #059669, #10b981);
            border: 1px solid #34d399;
            width: calc(100% - 20px);
        }

        /* Interactive Timeline Playhead Scrubber slider overlay */
        .scrubber-slider {
            position: absolute;
            left: 20px;
            right: 20px;
            top: 0;
            height: 100%;
            width: calc(100% - 40px);
            -webkit-appearance: none;
            appearance: none;
            background: transparent;
            pointer-events: none;
            z-index: 10;
            margin: 0;
        }

        .scrubber-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 2px;
            height: 250px;
            background: #ffffff;
            box-shadow: 0 0 8px #ff0055, 0 0 0 4px rgba(255, 0, 85, 0.4);
            cursor: ew-resize;
            pointer-events: auto;
        }

        .hidden { display: none; }
    </style>
</head>
<body>

    <!-- Header Navbar -->
    <div class="navbar">
        <div class="project-title">Summer Surf Gear Guide</div>
        <button class="export-btn" id="exportBtn">Export Video</button>
    </div>

    <!-- Workspace View -->
    <div class="workspace">
        <!-- Sidebar Custom Tools Panel -->
        <div class="sidebar-controls">
            <div class="control-block">
                <label>Media Source</label>
                <input type="file" id="videoUpload" accept="video/*,audio/*">
            </div>

            <div class="control-block">
                <label>Trim Bounds (Seconds)</label>
                <div class="range-row">
                    <div>
                        <input type="number" id="clipStart" min="0" value="0" step="0.1" style="width:100%; box-sizing:border-box;">
                    </div>
                    <div>
                        <input type="number" id="clipEnd" min="0" value="10" step="0.1" style="width:100%; box-sizing:border-box;">
                    </div>
                </div>
            </div>

            <div class="control-block">
                <label>Fade Transitions (Seconds)</label>
                <div class="range-row">
                    <div>
                        <input type="number" id="fadeIn" min="0" value="0.5" step="0.1" style="width:100%; box-sizing:border-box;" placeholder="In">
                    </div>
                    <div>
                        <input type="number" id="fadeOut" min="0" value="0.5" step="0.1" style="width:100%; box-sizing:border-box;" placeholder="Out">
                    </div>
                </div>
            </div>

            <div class="control-block">
                <label>Overlay Text Label</label>
                <input type="text" id="textOverlay" value="Woohoo!">
            </div>

            <div class="control-block">
                <label>Font Branding Style</label>
                <div class="range-row">
                    <select id="fontStyle" style="flex: 2;">
                        <option value="Impact">YouTube Bold (Impact)</option>
                        <option value="Arial">Arial Standard</option>
                        <option value="Courier New">Monospace Text</option>
                    </select>
                    <input type="number" id="fontSize" value="90" style="flex: 1; width:50px;">
                </div>
            </div>

            <div class="control-block">
                <label>Resolution Profile</label>
                <select id="resolution">
